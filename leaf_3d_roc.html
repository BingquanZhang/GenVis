<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive 3D ROC-bent LeafPlot of 300 simulated gene expression values in 30 control and 70 cancer patients, with rotation, shared or separate group bandwidths and mouse-wheel zoom.">
<title>Interactive 3D ROC-Bent LeafPlot of Gene Expressions</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: #fff; color: #202020; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 28px 28px 20px; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { margin: 0; font-size: clamp(25px, 2.6vw, 34px); line-height: 1.3; font-weight: 650; letter-spacing: -.6px; }
  .title-detail { display: block; margin-top: 8px; font-size: inherit; font-weight: inherit; letter-spacing: inherit; }
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 26px; align-items: start; }
  .sidebar { display: grid; gap: 16px; }
  .panel { padding: 20px 18px; border: 1px solid #e2e4e7; border-radius: 12px; background: #fafafa; }
  h2 { margin: 0 0 14px; font-size: 19px; font-weight: 650; }
  .control + .control { margin-top: 20px; }
  .control-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  label { font-size: 16px; font-weight: 500; line-height: 1.45; }
  output { font-size: 16px; font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; flex: none; }
  input[type="range"] { display: block; width: 100%; margin: 0; height: 30px; accent-color: #30343b; cursor: pointer; }
  input:focus-visible, button:focus-visible { outline: 2px solid #4264a0; outline-offset: 4px; }
  .limits { display: flex; justify-content: space-between; color: #62666d; font-size: 13px; line-height: 1.5; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .legend { margin-top: 16px; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 32px; }
  .legend-row { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 600; }
  .swatch { width: 23px; height: 5px; flex: none; border-radius: 1px; }
  .control-color { background: #00ff00; }
  .cancer-color { background: #ff0000; }
  .bandwidth-panel h2 { margin-bottom: 14px; }
  .bandwidth-control + .bandwidth-control { margin-top: 18px; }
  .bandwidth-heading { margin-bottom: 7px; }
  .bandwidth-heading output { font-size: 20px; font-weight: 600; }
  #bandwidth-control { accent-color: #178b39; }
  #bandwidth-cancer { accent-color: #d72f32; }
  .bandwidth-limits > span { display: flex; flex-direction: column; align-items: center; }
  .bandwidth-limits > span:first-child { align-items: flex-start; }
  .bandwidth-limits > span:last-child { align-items: flex-end; }
  #bandwidth-form { border-top: 1px solid #e2e4e7; padding-top: 14px; margin-top: 16px; }
  .default-row { display: flex; align-items: stretch; gap: 9px; margin-top: 8px; }
  input[type="number"] { width: 100%; min-width: 0; height: 38px; border: 1px solid #c8ccd2; border-radius: 6px; padding: 6px 10px; background: white; color: #202020; font: inherit; font-variant-numeric: tabular-nums; }
  button { border: 1px solid #30343b; border-radius: 6px; padding: 6px 16px; background: #30343b; color: white; font: inherit; font-size: 14px; cursor: pointer; }
  button:hover { background: #15181c; }
  #bandwidth-error { margin: 9px 0 0; font-size: 13px; line-height: 1.5; color: #a52323; }
  figure { margin: 0; min-width: 0; position: relative; }
  .plot-status { position: absolute; top: 42%; left: 0; right: 0; text-align: center; color: #62666d; font-size: 15px; pointer-events: none; }
  canvas { display: block; width: 100%; height: min(780px, calc(100vh - 250px)); min-height: 510px; background: white; }
  figcaption { color: #40454b; text-align: center; line-height: 1.55; margin-top: 4px; }
  .zoom-instruction { display: block; font-size: 20px; font-weight: 500; }
  .error { padding: 20px; color: #a52323; }
  [hidden] { display: none !important; }
  @media (max-width: 800px) {
    main { padding: 20px 14px 16px; }
    header { margin-bottom: 23px; }
    .layout { grid-template-columns: 1fr; gap: 15px; }
    .sidebar { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
    .panel { padding: 18px 16px; }
    .control-heading { flex-wrap: wrap; gap: 4px; }
    .legend-row { font-size: 19px; }
    canvas { min-height: 360px; height: 64vh; }
    .zoom-instruction { font-size: 18px; }
  }
  @media (max-width: 540px) {
    .sidebar { grid-template-columns: 1fr; }
    .view-panel { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
    .view-panel h2 { grid-column: 1 / -1; margin: 0; }
    .control + .control { margin: 0; }
    .legend { gap: 12px 22px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Interactive 3D ROC-Bent LeafPlot of 300 Gene Expressions<span class="title-detail">in a Sample of 30 Control and 70 Cancer Patients</span></h1>
    <div class="legend" aria-label="Group legend">
      <div class="legend-row"><span class="swatch control-color" aria-hidden="true"></span><span>Control = 30</span></div>
      <div class="legend-row"><span class="swatch cancer-color" aria-hidden="true"></span><span>Cancer = 70</span></div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Plot controls">
      <section class="panel view-panel" aria-labelledby="view-heading">
        <h2 id="view-heading">Viewing angles</h2>
        <div class="control">
          <div class="control-heading"><label for="elevation">Z-angle φ (elevation)</label><output id="elevation-value" for="elevation">20.0°</output></div>
          <input id="elevation" type="range" min="0" max="90" step="0.1" value="20">
        </div>
        <div class="control">
          <div class="control-heading"><label for="rotation">(X,Y)-plane θ angle rotation</label><output id="rotation-value" for="rotation">0.0°</output></div>
          <input id="rotation" type="range" min="0" max="360" step="0.1" value="0" aria-describedby="rotation-limits">
          <div class="limits" id="rotation-limits"><span>0°</span><span>360°</span></div>
        </div>
      </section>
      <section class="panel bandwidth-panel" aria-labelledby="bandwidth-heading">
        <h2 id="bandwidth-heading">Bandwidth selection</h2>
        <div class="bandwidth-control">
          <div class="control-heading bandwidth-heading"><label for="bandwidth">Shared bandwidth</label><output id="bandwidth-value" for="bandwidth">0.360</output></div>
          <input id="bandwidth" type="range" min="-1" max="1" step="0.005" value="0" aria-describedby="bandwidth-limits">
          <div class="limits bandwidth-limits" id="bandwidth-limits">
            <span><span id="bandwidth-low">0.180</span></span>
            <span><span id="bandwidth-middle">0.360</span></span>
            <span><span id="bandwidth-high">0.720</span></span>
          </div>
        </div>
        <div class="bandwidth-control">
          <div class="control-heading bandwidth-heading"><label for="bandwidth-control">Control bandwidth</label><output id="bandwidth-control-value" for="bandwidth-control">0.360</output></div>
          <input id="bandwidth-control" type="range" min="-1" max="1" step="0.005" value="0" aria-describedby="bandwidth-control-limits">
          <div class="limits" id="bandwidth-control-limits"><span id="bandwidth-control-low">0.180</span><span id="bandwidth-control-middle">0.360</span><span id="bandwidth-control-high">0.720</span></div>
        </div>
        <div class="bandwidth-control">
          <div class="control-heading bandwidth-heading"><label for="bandwidth-cancer">Cancer bandwidth</label><output id="bandwidth-cancer-value" for="bandwidth-cancer">0.360</output></div>
          <input id="bandwidth-cancer" type="range" min="-1" max="1" step="0.005" value="0" aria-describedby="bandwidth-cancer-limits">
          <div class="limits" id="bandwidth-cancer-limits"><span id="bandwidth-cancer-low">0.180</span><span id="bandwidth-cancer-middle">0.360</span><span id="bandwidth-cancer-high">0.720</span></div>
        </div>
        <form id="bandwidth-form" novalidate>
          <label for="bandwidth-default">User-defined bandwidth</label>
          <div class="default-row"><input id="bandwidth-default" name="default-bandwidth" type="number" min="0" step="any" value="0.36" inputmode="decimal" aria-describedby="bandwidth-error" required><button type="submit">Apply</button></div>
          <p id="bandwidth-error" role="alert" hidden>Enter a positive bandwidth.</p>
        </form>
      </section>
    </aside>
    <figure>
      <p id="plot-status" class="plot-status" role="status">Preparing plot…</p>
      <canvas id="leaf-canvas" role="img" aria-label="Interactive 3D ROC-bent LeafPlot of simulated data. The common curved stem compares Cancer with Control. Green represents 30 controls; red represents 70 cancer patients. Use the sliders to change elevation, rotation and shared or separate group bandwidths for the leaves and curved stem. Scroll to zoom and double-click to reset the zoom.">Please use a browser that supports WebGL to view this plot.</canvas>
      <figcaption><span class="zoom-instruction">Scroll the mouse wheel to zoom in or out</span></figcaption>
      <p id="canvas-error" class="error" hidden>This browser cannot draw the plot. Please open this file in a browser that supports WebGL.</p>
    </figure>
  </div>
  <noscript><p>Please enable JavaScript to view the interactive plot.</p></noscript>
</main>

"use strict";

// Frozen patient values are the same ones used by the straight-stem HTML.
// X = Cancer; Y = Control. Each group uses its selected bandwidth, and each
// leaf radius is still divided by THAT LEAF'S maximum density.
function createLeafComputer(data) {
  const n = data.z.length;
  const loValue = data.displayRange[0], span = data.displayRange[1] - loValue;
  const radians = Math.PI / 180;
  const specimens = data.leaves.map(p => {
    const values = p.values.filter(Number.isFinite);
    const sorted = values.slice().sort((a, b) => a - b);
    return {...p, values, c: Math.cos(p.angle * radians), s: Math.sin(p.angle * radians),
      z: values.map(v => (v - loValue) / span * data.H),
      quartileZ: [.25, .5, .75].map(q => (sorted[Math.floor(values.length * q) - 1] - loValue) / span * data.H)};
  });
  const X = specimens.filter(p => p.group === "Cancer").flatMap(p => p.values).sort((a,b) => a-b);
  const Y = specimens.filter(p => p.group === "Control").flatMap(p => p.values).sort((a,b) => a-b);

  function densityGrid(h) {
    const low = loValue - 4 * h, high = data.displayRange[1] + 4 * h;
    const step = (high - low) / (n - 1);
    // Retain the R density coordinates used in the original HTML export.
    const kernelStep = data.densityOldCoordinates ? 2 * (high - low) / (2*n - 1) : step;
    const kernel = new Float64Array(n);
    for (let i=0; i<n; i++) {
      const u = i * kernelStep / h;
      kernel[i] = Math.exp(-.5*u*u) / (Math.sqrt(2*Math.PI)*h);
    }
    return {low, step, kernel};
  }

  function densityValues(values, grid) {
    const mass = new Float64Array(n), smoothed = new Float64Array(n);
    for (const value of values) {
      const u = (value-grid.low)/grid.step, j = Math.floor(u), f = u-j;
      if (j>=0 && j<n) mass[j] += (1-f)/values.length;
      if (j+1>=0 && j+1<n) mass[j+1] += f/values.length;
    }
    for (let j=0; j<n; j++) {
      if (mass[j] === 0) continue;
      for (let i=0; i<j; i++) smoothed[i] += mass[j]*grid.kernel[j-i];
      for (let i=j; i<n; i++) smoothed[i] += mass[j]*grid.kernel[i-j];
    }
    const result = new Float64Array(n);
    for (let i=0; i<n; i++) {
      const t = loValue + data.z[i]/data.H*span;
      const u = Math.max(0,Math.min(n-1,(t-grid.low)/grid.step));
      const j = Math.min(n-2,Math.floor(u)), f = u-j;
      result[i] = (1-f)*smoothed[j]+f*smoothed[j+1];
    }
    return result;
  }

  function normalCDF(x) {
    // Accurate normal tail approximation; use the small tail to avoid cancellation.
    const a = Math.abs(x);
    if (a > 8) return x < 0 ? 0 : 1;
    const e = Math.exp(-.5*a*a);
    let tail;
    if (a < 7.0710678118654755) {
      const numerator = ((((((.03526249659989109*a+.7003830644436881)*a+6.37396220353165)*a+33.912866078383)*a+112.0792914978709)*a+221.2135961699311)*a+220.2068679123761);
      const denominator = (((((((.08838834764831844*a+1.755667163182642)*a+16.06417757920695)*a+86.78073220294608)*a+296.5642487796737)*a+637.3336333788311)*a+793.8265125199484)*a+440.4137358247522);
      tail = e*numerator/denominator;
    } else {
      tail = e / (a + 1/(a + 2/(a + 3/(a + 4/(a + .65))))) / Math.sqrt(2*Math.PI);
    }
    return x <= 0 ? tail : 1-tail;
  }

  function mixtureCDF(sorted, h) {
    const result = new Float64Array(n);
    let left = 0, right = 0;
    for (let i=0; i<n; i++) {
      const t = loValue + data.z[i]/data.H*span;
      // Beyond eight SDs the omitted normal tail is below 7e-16 per value.
      while (left<sorted.length && sorted[left]<t-8*h) left++;
      while (right<sorted.length && sorted[right]<=t+8*h) right++;
      let total = left;
      for (let j=left; j<right; j++) total += normalCDF((t-sorted[j])/h);
      result[i] = total/sorted.length;
    }
    return result;
  }

  function at(values, z) {
    const u = Math.max(0,Math.min(n-1,z/data.H*(n-1)));
    const j = Math.min(n-2,Math.floor(u)), f = u-j;
    return (1-f)*values[j]+f*values[j+1];
  }

    const controlGrid = densityGrid(hControl);
    const cancerGrid = hCancer === hControl ? controlGrid : densityGrid(hCancer);
    // The two CDFs and the Cancer density use their own group's bandwidth.
    const fX = densityValues(X,cancerGrid);
    const FX = mixtureCDF(X,hCancer), FY = mixtureCDF(Y,hControl);
    const D = new Float64Array(n), rawB = new Float64Array(n);
    const radii = specimens.map(p => {
      const grid = p.group === "Control" ? controlGrid : cancerGrid;
      const f = densityValues(p.values,grid), maximum = Math.max(...f);
      return Float64Array.from(f, v => data.W*v/maximum);
    });
    for (let i=0; i<n; i++) {
      D[i] = FY[i]-FX[i];
      // The final material_leaf.R rule, without changing its density weight.
      rawB[i] = bent ? span*data.W*D[i]*fX[i] : 0;
    }
    let normalizer = 0;
    for (let i=0; i<n; i++) {
      normalizer = Math.max(normalizer,Math.abs(rawB[i]));
      for (let k=0; k<specimens.length; k++) {
        const p=specimens[k], r=radii[k][i];
        normalizer = Math.max(normalizer,Math.hypot(rawB[i]+r*p.c,r*p.s));
      }
    }
    // 3D extension of max(abs(raw_x)): use horizontal distance from the origin.
    // One factor scales the entire bent object in x AND y. H does not change.
    // Interpolated segment endpoints lie within these contour/stem edges.
    const scale = data.W/normalizer;
    const B = Float64Array.from(rawB,b=>scale*b);
    const envelope = Float64Array.from(data.z,(_,i)=>scale*Math.max(...radii.map(r=>r[i])));
    return {bandwidths:{control:hControl,cancer:hCancer},FX,FY,D,fX,rawB,B,radii,normalizer,scale,envelope,nX:X.length,nY:Y.length};
  }

  const corners = [0,-1, 1,-1, 1,1, 0,-1, 1,1, 0,1];
  function lineBuffer(count) {return {data:new Float32Array(count*66), offset:0};}
  function line(buffer, a, b, color) {
    for (let i=0; i<6; i++) {
      const j=buffer.offset;
      buffer.data.set(a,j);buffer.data.set(b,j+3);
      buffer.data[j+6]=corners[2*i];buffer.data[j+7]=corners[2*i+1];
      buffer.data.set(color,j+8);buffer.offset+=11;
    }
  }

  function geometry(hControl, hCancer = hControl, bent = true) {
    const stats=statistics(hControl,hCancer,bent), black=[0,0,0];
    const surface=new Float32Array(specimens.length*(n-1)*18);
    const ribs=lineBuffer(specimens.reduce((s,p)=>s+p.z.filter(z=>z>=0&&z<=data.H).length,0));
    const contour=lineBuffer(specimens.length*(n-1)), ends=lineBuffer(specimens.length*2);
    const median=lineBuffer(specimens.length), quartiles=lineBuffer(specimens.length*2);
    const stem=lineBuffer(n-1);
    let fillOffset=0;
    const stemAt=z=>[at(stats.B,z),0,z];
    for (let k=0; k<specimens.length; k++) {
      const p=specimens[k],radius=stats.radii[k];
      const color=p.group==="Control"?[0,1,0]:[1,0,0];
      const outerAt=z=>{
        const r=at(radius,z)*stats.scale;
        return [at(stats.B,z)+r*p.c,r*p.s,z];
      };
      for (let i=0; i<n-1; i++) {
        const a=stemAt(data.z[i]), b=outerAt(data.z[i]);
        const c=outerAt(data.z[i+1]), d=stemAt(data.z[i+1]);
        for (const point of [a,b,c,a,c,d]) {surface.set(point,fillOffset);fillOffset+=3;}
        line(contour,b,c,black);
      }
      line(ends,stemAt(0),outerAt(0),black);
      line(ends,stemAt(data.H),outerAt(data.H),black);
      for (const z of p.z) if (z>=0&&z<=data.H) line(ribs,stemAt(z),outerAt(z),color);
      p.quartileZ.forEach((z,i)=>{
        if (z>=0&&z<=data.H) line(i===1?median:quartiles,stemAt(z),outerAt(z),black);
      });
    }
    for (let i=0; i<n-1; i++) line(stem,stemAt(data.z[i]),stemAt(data.z[i+1]),black);
    return {bandwidths:stats.bandwidths,surface,ribs:ribs.data,contour:contour.data,ends:ends.data,
      median:median.data.subarray(0,median.offset),quartiles:quartiles.data.subarray(0,quartiles.offset),stem:stem.data,
      B:stats.B,envelope:stats.envelope,
      roc:{FX:stats.FX,FY:stats.FY,D:stats.D,fX:stats.fX,rawB:stats.rawB,scale:stats.scale,normalizer:stats.normalizer,nX:stats.nX,nY:stats.nY}};
  }
  return {geometry,statistics,normalCDF,densityGrid,densityValues,specimens,at};
}

</script>
<script>
(() => {
  "use strict";
  const data=JSON.parse(document.getElementById("leaf-data").textContent);
  const shaders=JSON.parse(document.getElementById("leaf-shaders").textContent);
  const canvas=document.getElementById("leaf-canvas");
  const elevationInput=document.getElementById("elevation"),rotationInput=document.getElementById("rotation");
  const elevationValue=document.getElementById("elevation-value"),rotationValue=document.getElementById("rotation-value");
  const bandwidthInput=document.getElementById("bandwidth");
  const bandwidthValue=document.getElementById("bandwidth-value"),defaultInput=document.getElementById("bandwidth-default");
  const groupInputs={control:document.getElementById("bandwidth-control"),cancer:document.getElementById("bandwidth-cancer")};
  const groupValues={control:document.getElementById("bandwidth-control-value"),cancer:document.getElementById("bandwidth-cancer-value")};
  const bandwidthError=document.getElementById("bandwidth-error");
  const status=document.getElementById("plot-status"),error=document.getElementById("canvas-error");
  const motionPreference=window.matchMedia("(prefers-reduced-motion: reduce)");
  let renderer;
  function showError(message) {status.hidden=true;error.textContent=message;error.hidden=false;canvas.setAttribute("aria-busy","false");}
  try {renderer=createLeafRenderer(canvas,shaders,data);}
  catch (e) {showError("3D graphics are unavailable. Enable graphics acceleration or try another browser.");return;}

  let width=1,height=1,pixelRatio=1;
  let rotation=0,elevation=data.phi,targetRotation=0,targetElevation=data.phi;
  let zoom=1,targetZoom=1,animationId=null,previousTime=null;
  let defaultBandwidth=data.defaultBandwidth;
  let targetBandwidths={control:defaultBandwidth,cancer:defaultBandwidth},currentBandwidths=null;
  let inFlight=false,geometry=null,worker;

  // A worker computes the full-sample Gaussian CDFs without blocking rotation.
  const workerSource=document.getElementById("leaf-compute").textContent+`
let computer;
self.onmessage=event=>{
  if(event.data.type==="init"){computer=createLeafComputer(event.data.data);return;}
  try {
    const geometry=computer.geometry(event.data.bandwidths.control,event.data.bandwidths.cancer);
    const arrays=[...Object.values(geometry),...Object.values(geometry.roc)].filter(ArrayBuffer.isView);
    self.postMessage({geometry},arrays.map(a=>a.buffer));
  } catch(error) {self.postMessage({error:String(error.message||error)});}
};`;
  let workerURL;
  try {
    workerURL=URL.createObjectURL(new Blob([workerSource],{type:"text/javascript"}));
    worker=new Worker(workerURL);
    worker.postMessage({type:"init",data});
  } catch(e) {showError("The plot could not start. Please open this HTML file directly in a current browser.");return;}

  function formatBandwidth(value) {return value>=.001&&value<1000?value.toFixed(3):value.toExponential(2);}
  function updateBandwidthLabels() {
    const shared=targetBandwidths.control===targetBandwidths.cancer;
    bandwidthValue.textContent=shared?formatBandwidth(targetBandwidths.control):"Mixed";
    if(shared)bandwidthInput.value=groupInputs.control.value;
    bandwidthInput.setAttribute("aria-valuetext",shared?"Both groups "+formatBandwidth(targetBandwidths.control):
      "Control "+formatBandwidth(targetBandwidths.control)+"; Cancer "+formatBandwidth(targetBandwidths.cancer)+". Move to set both groups.");
    for(const group of ["control","cancer"]){
      groupValues[group].textContent=formatBandwidth(targetBandwidths[group]);
      groupInputs[group].setAttribute("aria-valuetext",groupValues[group].textContent);
    }
    for(const prefix of ["bandwidth","bandwidth-control","bandwidth-cancer"]){
      document.getElementById(prefix+"-low").textContent=formatBandwidth(defaultBandwidth/2);
      document.getElementById(prefix+"-middle").textContent=formatBandwidth(defaultBandwidth);
      document.getElementById(prefix+"-high").textContent=formatBandwidth(defaultBandwidth*2);
    }
  }
  function isCurrent() {
    return currentBandwidths!==null&&currentBandwidths.control===targetBandwidths.control&&currentBandwidths.cancer===targetBandwidths.cancer;
  }
  function requestGeometry() {
    if(inFlight||isCurrent())return;
    inFlight=true;canvas.setAttribute("aria-busy","true");
    worker.postMessage({type:"build",bandwidths:{...targetBandwidths}});
  }
  worker.onmessage=event=>{
    if(workerURL){URL.revokeObjectURL(workerURL);workerURL=null;}
    inFlight=false;
    if(event.data.error){showError("The plot could not update. Please choose another positive bandwidth.");return;}
    geometry=event.data.geometry;currentBandwidths=geometry.bandwidths;renderer.upload(geometry);
    status.hidden=true;error.hidden=true;queueFrame();
    canvas.setAttribute("aria-busy",String(!isCurrent()));
    // Coalesce dragging: finish the current update, then compute the latest value.
    requestGeometry();
  };
  worker.onerror=()=>{inFlight=false;if(workerURL)URL.revokeObjectURL(workerURL);showError("The plot could not finish loading. Please reopen the HTML file in a current browser.");};

  function draw(){renderer.draw(width,height,pixelRatio,rotation,elevation,zoom);}
  function queueFrame(){if(animationId===null)animationId=requestAnimationFrame(animate);}
  function animate(time) {
    animationId=null;
    const elapsed=previousTime===null?1000/60:Math.min(64,Math.max(1,time-previousTime));previousTime=time;
    const blend=motionPreference.matches?1:1-Math.exp(-elapsed/45);
    rotation+=(targetRotation-rotation)*blend;elevation+=(targetElevation-elevation)*blend;zoom+=(targetZoom-zoom)*blend;
    if(Math.abs(targetRotation-rotation)<.005)rotation=targetRotation;
    if(Math.abs(targetElevation-elevation)<.005)elevation=targetElevation;
    if(Math.abs(targetZoom-zoom)<.0001)zoom=targetZoom;
    draw();
    if(rotation!==targetRotation||elevation!==targetElevation||zoom!==targetZoom)queueFrame();else previousTime=null;
  }
  function updateView() {
    targetRotation=Number(rotationInput.value);targetElevation=Number(elevationInput.value);
    rotationValue.textContent=targetRotation.toFixed(1)+"°";elevationValue.textContent=targetElevation.toFixed(1)+"°";
    rotationInput.setAttribute("aria-valuetext",rotationValue.textContent);
    elevationInput.setAttribute("aria-valuetext",elevationValue.textContent);queueFrame();
  }
  function resize() {
    const rect=canvas.getBoundingClientRect();width=Math.max(100,rect.width);height=Math.max(100,rect.height);
    pixelRatio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(width*pixelRatio);canvas.height=Math.round(height*pixelRatio);draw();
  }
  elevationInput.addEventListener("input",updateView);rotationInput.addEventListener("input",updateView);
  bandwidthInput.addEventListener("input",()=>{
    const value=defaultBandwidth*Math.pow(2,Number(bandwidthInput.value));
    targetBandwidths={control:value,cancer:value};
    for(const input of Object.values(groupInputs))input.value=bandwidthInput.value;
    updateBandwidthLabels();requestGeometry();
  });
  for(const group of ["control","cancer"])groupInputs[group].addEventListener("input",()=>{
    // Changing one group leaves the other group's selected bandwidth untouched.
    targetBandwidths[group]=defaultBandwidth*Math.pow(2,Number(groupInputs[group].value));
    updateBandwidthLabels();requestGeometry();
  });
  document.getElementById("bandwidth-form").addEventListener("submit",event=>{
    event.preventDefault();const value=Number(defaultInput.value);
    const valid=defaultInput.value.trim()!==""&&value>0&&Number.isFinite(value*16)&&Number.isFinite(1/value);
    bandwidthError.hidden=valid;defaultInput.setAttribute("aria-invalid",String(!valid));if(!valid)return;
    defaultBandwidth=value;targetBandwidths={control:value,cancer:value};bandwidthInput.value="0";
    for(const input of Object.values(groupInputs))input.value="0";
    updateBandwidthLabels();requestGeometry();
  });
  canvas.addEventListener("wheel",event=>{
    event.preventDefault();const unit=event.deltaMode===1?16:event.deltaMode===2?height:1;
    const delta=Math.max(-160,Math.min(160,event.deltaY*unit));
    targetZoom=Math.max(.5,Math.min(3,targetZoom*Math.exp(-delta*.002)));queueFrame();
  },{passive:false});
  canvas.addEventListener("dblclick",()=>{targetZoom=1;queueFrame();});
  canvas.addEventListener("webglcontextlost",event=>{event.preventDefault();});
  canvas.addEventListener("webglcontextrestored",()=>{
    try {renderer=createLeafRenderer(canvas,shaders,data);if(geometry)renderer.upload(geometry);queueFrame();}
    catch(e){showError("3D graphics could not be restored. Please reload the page.");}
  });
  elevationInput.value=String(data.phi);rotationInput.value="0";defaultInput.value=String(defaultBandwidth);bandwidthInput.value="0";
  for(const input of Object.values(groupInputs))input.value="0";
  elevationValue.textContent=Number(data.phi).toFixed(1)+"°";rotationValue.textContent="0.0°";
  updateBandwidthLabels();new ResizeObserver(resize).observe(canvas);window.addEventListener("resize",resize);resize();requestGeometry();

  // White surfaces write the depth buffer. Every line is then tested against it,
// so a bent sheet hides rear lines correctly at every height and rotation.
function createLeafRenderer(canvas, shaders, data) {
  const gl=canvas.getContext("webgl",{alpha:false,antialias:true,preserveDrawingBuffer:false});
  if (!gl) throw new Error("3D graphics are unavailable in this browser.");
  function program(vs,fs) {
    function shader(type,source) {
      const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);
      if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }
    const p=gl.createProgram(),v=shader(gl.VERTEX_SHADER,vs),f=shader(gl.FRAGMENT_SHADER,fs);
    gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);gl.deleteShader(v);gl.deleteShader(f);
    if (!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const uniforms={};
    for (const name of ["u_camera","u_screen","u_depthScale","u_resolution","u_lineWidth","u_dash","u_tint"])
      uniforms[name]=gl.getUniformLocation(p,name);
    return {p,uniforms};
  }
  const fillProgram=program(shaders.surfaceVertex,shaders.surfaceFragment);
  const lineProgram=program(shaders.lineVertex,shaders.lineFragment);
  const position=gl.getAttribLocation(fillProgram.p,"a_position");
  const lineAttributes=[["a_start",3,0],["a_end",3,12],["a_corner",2,24],["a_color",3,32]]
    .map(([name,size,offset])=>({location:gl.getAttribLocation(lineProgram.p,name),size,offset}));
  const buffers={};let current=null;
  function upload(geometry) {
    current=geometry;
    for (const name of ["surface","ribs","contour","ends","median","quartiles","stem"]) {
      if (!buffers[name]) buffers[name]={buffer:gl.createBuffer(),count:0};
      gl.bindBuffer(gl.ARRAY_BUFFER,buffers[name].buffer);
      gl.bufferData(gl.ARRAY_BUFFER,geometry[name],gl.STATIC_DRAW);
      buffers[name].count=geometry[name].length/(name==="surface"?3:11);
    }
  }
  function draw(width,height,pixelRatio,rotation,elevation,zoom) {
    gl.viewport(0,0,canvas.width,canvas.height);gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(1,1,1,1);gl.clearDepth(1);gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    if (!current) return;
    const a=((data.theta+rotation)%360)*Math.PI/180,e=elevation*Math.PI/180;
    const ca=Math.cos(a),sa=Math.sin(a),ce=Math.cos(e),se=Math.sin(e);
    let low=0,high=data.H;
    data.z.forEach((z,i)=>{
      const center=z*ce-current.B[i]*sa*se,extent=current.envelope[i]*Math.abs(se);
      low=Math.min(low,center-extent);high=Math.max(high,center+extent);
    });
    const left=14,right=14,top=8,bottom=26;
    const sx=(width-left-right)/(2*data.W)*.7*zoom;
    const sy=(height-top-bottom)/(high-low)*zoom;
    const ox=left+(width-left-right)/2,oy=top+(height-top-bottom)/2+sy*(high+low)/2;
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(Math.round(left*pixelRatio),Math.round(bottom*pixelRatio),Math.max(1,Math.round((width-left-right)*pixelRatio)),Math.max(1,Math.round((height-top-bottom)*pixelRatio)));
    gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
    function common(p) {
      gl.useProgram(p.p);const u=p.uniforms;
      gl.uniform4f(u.u_camera,ca,sa,ce,se);
      gl.uniform4f(u.u_screen,2*sx/width,2*sy/height,2*ox/width-1,1-2*oy/height);
      gl.uniform1f(u.u_depthScale,1/(data.W+data.H+1));
    }
    common(fillProgram);gl.disable(gl.BLEND);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,2);
    gl.bindBuffer(gl.ARRAY_BUFFER,buffers.surface.buffer);
    gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,3,gl.FLOAT,false,12,0);
    gl.drawArrays(gl.TRIANGLES,0,buffers.surface.count);gl.disableVertexAttribArray(position);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    common(lineProgram);gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    const u=lineProgram.uniforms;gl.uniform2f(u.u_resolution,width,height);
    for (const a of lineAttributes) gl.enableVertexAttribArray(a.location);
    function lines(name,lineWidth,dashed=false,white=false) {
      gl.bindBuffer(gl.ARRAY_BUFFER,buffers[name].buffer);
      for (const a of lineAttributes) gl.vertexAttribPointer(a.location,a.size,gl.FLOAT,false,44,a.offset);
      gl.uniform1f(u.u_lineWidth,lineWidth);gl.uniform2f(u.u_dash,4,dashed?4:0);
      gl.uniform4f(u.u_tint,1,1,1,white?1:0);
      gl.drawArrays(gl.TRIANGLES,0,buffers[name].count);
    }
    lines("ribs",.55);lines("contour",1.7);lines("ends",1);
    // Draw statistical lines directly, without the extra white underlay.
    lines("median",1);lines("quartiles",1,true);
    // As in the original R plot, draw the common stem last as a visible reference.
    gl.disable(gl.DEPTH_TEST);lines("stem",1.8);gl.enable(gl.DEPTH_TEST);
    for (const a of lineAttributes) gl.disableVertexAttribArray(a.location);
    gl.depthMask(true);gl.disable(gl.SCISSOR_TEST);
  }
  return {upload,draw};
}

})();

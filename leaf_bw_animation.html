<script>

"use strict";
const RAW = JSON.parse(document.getElementById("leafdata").textContent);

/* ---- R-compatible numerics ------------------------------------------ */
function quantile7(sorted, p){                 // R's quantile(type = 7)
  const n = sorted.length, h = (n - 1) * p, lo = Math.floor(h), hi = Math.min(lo + 1, n - 1);
  return sorted[lo] + (h - lo) * (sorted[hi] - sorted[lo]);
}
function sdev(a){
  let m = 0; for (const v of a) m += v; m /= a.length;
  let s = 0; for (const v of a) s += (v - m) * (v - m);
  return Math.sqrt(s / (a.length - 1));
}
// Abramowitz & Stegun 7.1.26 -- plenty for drawing
function erf(x){
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
                  - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
// gaussian kernel, scaled so that sd = h, as R's density() does
const GK = {
  a: h => 5 * h,
  pdf: (u,h) => Math.exp(-.5*u*u/(h*h)) / (h * 2.5066282746310002),
  cdf: (u,h) => .5 * (1 + erf(u / (h * Math.SQRT2)))
};
// density and kernel-smoothed cdf on a uniform grid, two-pointer sweep.
// The cdf is smoothed with the same bandwidth as the density -- this is
// V.SMOOTH = 1 in the R code, i.e. what leafseg.R has always done. Points
// further than 5h below the grid point contribute exactly 1 to the cdf, so
// only the window has to be summed.
function densCdf(sorted, grid, h){
  const a = GK.a(h), n = sorted.length, m = grid.length;
  const f = new Float64Array(m), F = new Float64Array(m);
  let lo = 0, hi = 0;
  for (let j = 0; j < m; j++){
    const z = grid[j];
    while (lo < n && sorted[lo] <  z - a) lo++;
    while (hi < n && sorted[hi] <= z + a) hi++;
    let sf = 0, sF = 0;
    for (let i = lo; i < hi; i++){
      const u = z - sorted[i];
      sf += GK.pdf(u, h);
      sF += GK.cdf(u, h);
    }
    f[j] = sf / n;
    F[j] = (lo + sF) / n;
  }
  return {f, F};
}

/* ---- the leaf, transcribed from leafseg2.R -------------------------- */
const NL = 512;
function leafseg(g, o){
  const X = g.xs, Y = g.ys, nX = X.length, nY = Y.length;
  const rTAN = Math.tan(o.ang * Math.PI / 180);
  const h = o.bw;                                   // absolute, both petals

  let lo, hi;
  if (o.trnc > 0){ lo = quantile7(g.xys, o.trnc); hi = quantile7(g.xys, 1 - o.trnc); }
  else { lo = g.xys[0] - 0.1 * g.sdXY; hi = g.xys[g.xys.length - 1] + 0.1 * g.sdXY; }

  const z = new Float64Array(NL), step = (hi - lo) / (NL - 1);
  for (let i = 0; i < NL; i++) z[i] = lo + i * step;

  const dx = densCdf(X, z, h), dy = densCdf(Y, z, h);
  let mdeX = 0, mdeY = 0;
  for (let i = 0; i < NL; i++){ if (dx.f[i] > mdeX) mdeX = dx.f[i]; if (dy.f[i] > mdeY) mdeY = dy.f[i]; }

  const vgrid = new Float64Array(NL), stem = new Float64Array(NL);
  const lam = nX / (nX + nY);
  const F0 = lam * dx.F[0] + (1 - lam) * dy.F[0];
  const F1 = lam * dx.F[NL-1] + (1 - lam) * dy.F[NL-1];
  for (let i = 0; i < NL; i++){
    const FP = lam * dx.F[i] + (1 - lam) * dy.F[i];
    vgrid[i] = (FP - F0) / (F1 - F0) * o.H;         // ROC-bent, fixed
    stem[i]  = (dy.F[i] - dx.F[i]) * o.W;
  }
  let area = 0;
  for (let i = 1; i < NL; i++) area += (vgrid[i] - vgrid[i-1]) * (stem[i] + stem[i-1]) / 2;
  area /= (o.W * o.H);

  const wX = new Float64Array(NL), wY = new Float64Array(NL);
  for (let i = 0; i < NL; i++){ wX[i] = dx.f[i] / mdeX * o.W; wY[i] = dy.f[i] / mdeY * o.W; }

  const interp = (arr, v) => {
    const t = (v - lo) / step;
    if (t <= 0) return arr[0];
    if (t >= NL - 1) return arr[NL - 1];
    const i = t | 0; return arr[i] + (t - i) * (arr[i+1] - arr[i]);
  };
  return {z, lo, hi, vgrid, stem, wX, wY, rTAN, areaHalf: area + .5, auc: g.auc,
          bw: h, nX, nY, W:o.W, H:o.H, veinAng: 90 - o.ang,
          vf: v => interp(vgrid, v), sf: v => interp(stem, v),
          wXf: v => interp(wX, v), wYf: v => interp(wY, v)};
}

function prepGene(d){
  const xs = Float64Array.from(d.x).sort();
  const ys = Float64Array.from(d.y).sort();
  const xys = Float64Array.from([...d.x, ...d.y]).sort();
  return {name: d.gene, xs, ys, xys, auc: d.auc, sdXY: sdev(xys)};
}
const GENE = prepGene(RAW);

/* ---- rendering: the leaf alone, no axes ----------------------------- */
const COL = { x:"#00CD00", y:"#EEB422", xd:"#0a8f0a", yd:"#a97c11" };
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let CW = 0, CH = 0;
function resize(){
  const b = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  CW = Math.max(280, b.width); CH = Math.max(280, b.height);
  cv.width = CW * dpr; cv.height = CH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function draw(r, o){
  ctx.clearRect(0, 0, CW, CH);
  // equal aspect: the tilt of a vein on screen is the tilt in the model
  // a tilted vein lifts the outline by up to W*tan(ang), so the box has to
  // reserve that much or the leaf clips. o.headFix pins the reservation to a
  // fixed angle instead, which keeps the SCALE constant while ang animates.
  // vgrid and the petal widths do not depend on ang -- ang only enters at
  // drawing time -- so the exact top the outline reaches at a GIVEN tilt can
  // be computed once and stays put while ang animates.
  const pad = 34, xr = o.W * 1.25;
  const tanUse = (o.headFix !== undefined ? o.headFix : r.rTAN);
  let top;
  if (o.boxFix){
    // Sweeping the BANDWIDTH moves vgrid and the petal widths, so a box taken
    // from the data would breathe frame to frame. vgrid is renormalised to
    // [0,H] and the widest petal is exactly W, so H + W*tan(ang) is an exact
    // upper bound -- use it and the frame is nailed down for the whole sweep.
    top = o.H + o.W * tanUse;
  } else {
    top = 0;
    for (let i = 0; i < NL; i++){
      const a = r.vgrid[i] + r.wX[i] * tanUse, b = r.vgrid[i] + r.wY[i] * tanUse;
      if (a > top) top = a; if (b > top) top = b;
    }
  }
  const yTop = Math.max(o.H, top) + 0.04 * o.H, yBot = -0.04 * o.H;
  const aW = CW - 2 * pad, aH = CH - 2 * pad - 20;
  const sc = Math.min(aW / (2 * xr), aH / (yTop - yBot));
  const cx = pad + aW / 2, cy = pad + aH / 2, midY = (yTop + yBot) / 2;
  const PX = (x, y) => [cx + x * sc, cy - (y - midY) * sc];

  const veins = (data, sign, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = .55; ctx.beginPath();
    for (const v of data){
      if (v < r.lo || v > r.hi) continue;
      const b = r.sf(v), hh = r.vf(v), w = sign > 0 ? r.wXf(v) : r.wYf(v);
      const p1 = PX(b, hh), p2 = PX(b + sign * w, hh + w * r.rTAN);
      ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
    }
    ctx.stroke();
  };
  veins(GENE.xs,  1, COL.x);
  veins(GENE.ys, -1, COL.y);

  ctx.strokeStyle = "#101216";
  for (const [q, dash] of [[.25,[5,4]],[.5,[]],[.75,[5,4]]]){
    ctx.setLineDash(dash); ctx.lineWidth = 2;
    for (const [data, sign] of [[GENE.xs, 1], [GENE.ys, -1]]){
      const v = quantile7(data, q);
      if (v < r.lo || v > r.hi) continue;
      const b = r.sf(v), hh = r.vf(v), w = sign > 0 ? r.wXf(v) : r.wYf(v);
      const p1 = PX(b, hh), p2 = PX(b + sign * w, hh + w * r.rTAN);
      ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  ctx.lineWidth = 2.2; ctx.lineJoin = "round";
  const contour = sign => { ctx.beginPath();
    for (let i = 0; i < NL; i++){
      const w = sign > 0 ? r.wX[i] : r.wY[i];
      const p = PX(r.stem[i] + sign * w, r.vgrid[i] + w * r.rTAN);
      i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]); }
    ctx.stroke(); };
  contour(1); contour(-1);
  for (const i of [0, NL-1]){                    // caps follow the chevron
    const a = PX(r.stem[i] - r.wY[i], r.vgrid[i] + r.wY[i]*r.rTAN);
    const b = PX(r.stem[i], r.vgrid[i]);
    const c = PX(r.stem[i] + r.wX[i], r.vgrid[i] + r.wX[i]*r.rTAN);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i < NL; i++){ const p = PX(r.stem[i], r.vgrid[i]); i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]); }
  ctx.stroke();

  ctx.font = "600 13px -apple-system, Segoe UI, sans-serif"; ctx.textBaseline = "top";
  ctx.textAlign = "right"; ctx.fillStyle = COL.yd;
  ctx.fillText("LUSC", PX(-o.W * 0.3, yBot)[0], PX(0, yBot)[1] + 8);
  ctx.textAlign = "left"; ctx.fillStyle = COL.xd;
  ctx.fillText("LUAD", PX(o.W * 0.3, yBot)[0], PX(0, yBot)[1] + 8);
}
const $ = id => document.getElementById(id);
const fmt = (v, n) => v.toFixed(n);


// boxFix: the frame is computed from H and W alone, so it cannot move while the
// bandwidth sweeps. headFix pins the tilt allowance to the fixed ang = 10.
const opts = { bw:0.187, ang:10, W:0.32, H:1, trnc:0,
               headFix: Math.tan(10 * Math.PI / 180), boxFix: true };
function render(){
  draw(leafseg(GENE, opts), opts);
  $("angv").textContent = opts.bw.toFixed(3);
}
$("bw").addEventListener("input", e => {
  if (playing) toggle();
  opts.bw = +e.target.value; render();
});

const LO = 0.03, HI = 0.30;
let playing = false, t0 = 0, raf = 0;
const PERIOD = 20000;                       // one full LO -> HI -> LO cycle, deliberately slow
function toggle(){
  playing = !playing;
  $("play").innerHTML = playing ? "&#9632; stop" : "&#9654; play";
  if (playing){ t0 = performance.now() - PERIOD * phaseOf(opts.bw); loop(); }
  else cancelAnimationFrame(raf);
}
function phaseOf(b){ return ((b - LO) / (HI - LO)) / 2; }
function loop(){
  if (!playing) return;
  const u = ((performance.now() - t0) % PERIOD) / PERIOD;
  const tri = u < .5 ? u * 2 : 2 - u * 2;            // ping-pong 0 -> 1 -> 0
  opts.bw = LO + (HI - LO) * tri * tri * (3 - 2 * tri);
  $("bw").value = opts.bw;
  render();
  raf = requestAnimationFrame(loop);
}
$("play").addEventListener("click", toggle);
window.addEventListener("resize", () => { resize(); render(); });
resize(); render(); toggle();
</script></body></html>
